<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>SQ开的餐厅 · 邮件模板</title><style>*{box-sizing:border-box}body{margin:0;padding:24px 16px 40px;background:#f6f3e9;color:#3e4938;font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:620px;margin:auto}h1{font-size:23px}section{background:#fffdf6;border:1px solid #dddccf;border-radius:18px;padding:18px;margin:16px 0}button,a.button{display:block;width:100%;background:#4c6a53;border:0;border-radius:12px;padding:14px;margin:12px 0;color:white;text-decoration:none;text-align:center;font:600 17px/1.4 system-ui;cursor:pointer}textarea{width:100%;min-height:160px;margin-top:12px;border:1px solid #c6cbbe;border-radius:8px;padding:10px;font:13px/1.5 monospace}summary{cursor:pointer}.status{min-height:24px}</style></head><body><main><h1>SQ开的餐厅 · 邮箱验证码</h1><p>在 Supabase 的 Authentication → Email/Emails → Templates 中，分别替换下面两个邮件的正文（Body/Source），并保存。</p>
<section><b>注册确认 · Confirm signup</b><button type="button" data-kind="signup">复制注册邮件正文</button><div class="status" id="signupStatus" role="status" aria-live="polite"></div><details id="signupDetails"><summary>展开手动复制</summary><textarea id="signupText" readonly aria-label="注册邮件正文"></textarea></details></section>
<section><b>密码重置 · Reset password</b><button type="button" data-kind="recovery">复制重置邮件正文</button><div class="status" id="recoveryStatus" role="status" aria-live="polite"></div><details id="recoveryDetails"><summary>展开手动复制</summary><textarea id="recoveryText" readonly aria-label="重置邮件正文"></textarea></details></section>
<a class="button" href="https://supabase.com/dashboard/project/xkskkuvvhibdqisgenlp" target="_blank" rel="noopener noreferrer">打开 Supabase 项目</a><p>保存后，玩家在游戏中发送邮件、查看验证码，再回到游戏填写，即可继续注册确认或设置新密码。</p>
<script type="application/json" id="emailTemplates">{"signup": "\u003ch2>SQ\u5f00\u7684\u9910\u5385 \u00b7 \u6ce8\u518c\u786e\u8ba4\u003c/h2>\n\u003cp>\u4f60\u7684\u90ae\u7bb1\u9a8c\u8bc1\u7801\uff1a\u003c/p>\n\u003cp style=\"font-size:32px;font-weight:bold;letter-spacing:6px\">{{ .Token }}\u003c/p>\n\u003cp>\u8bf7\u8fd4\u56de\u6e38\u620f\u4e2d\u7684\u201c\u90ae\u7bb1\u9a8c\u8bc1\u7801\u201d\u754c\u9762\uff0c\u9009\u62e9\u201c\u6ce8\u518c\u786e\u8ba4\u201d\uff0c\u586b\u5199\u6b64\u9a8c\u8bc1\u7801\u5b8c\u6210\u6ce8\u518c\u3002\u003c/p>\n\u003cp>\u9875\u9762\u5237\u65b0\u540e\uff0c\u53ef\u4ece\u8bbe\u7f6e \u2192 \u767b\u5f55\uff0f\u6ce8\u518c \u2192 \u90ae\u7bb1\u9a8c\u8bc1\u7801\u7ee7\u7eed\u9a8c\u8bc1\u3002\u003c/p>\n", "recovery": "\u003ch2>SQ\u5f00\u7684\u9910\u5385 \u00b7 \u91cd\u7f6e\u5bc6\u7801\u003c/h2>\n\u003cp>\u4f60\u7684\u5bc6\u7801\u91cd\u7f6e\u9a8c\u8bc1\u7801\uff1a\u003c/p>\n\u003cp style=\"font-size:32px;font-weight:bold;letter-spacing:6px\">{{ .Token }}\u003c/p>\n\u003cp>\u8bf7\u8fd4\u56de\u6e38\u620f\u4e2d\u7684\u201c\u90ae\u7bb1\u9a8c\u8bc1\u7801\u201d\u754c\u9762\uff0c\u9009\u62e9\u201c\u627e\u56de\u5bc6\u7801\u201d\uff0c\u586b\u5199\u6b64\u9a8c\u8bc1\u7801\u540e\u8bbe\u7f6e\u65b0\u5bc6\u7801\u3002\u003c/p>\n\u003cp>\u9875\u9762\u5237\u65b0\u540e\uff0c\u53ef\u4ece\u8bbe\u7f6e \u2192 \u767b\u5f55\uff0f\u6ce8\u518c \u2192 \u90ae\u7bb1\u9a8c\u8bc1\u7801\u7ee7\u7eed\u9a8c\u8bc1\u3002\u003c/p>\n"}</script><script>
'use strict';
const templates=JSON.parse(document.getElementById('emailTemplates').textContent);
for(const kind of ['signup','recovery'])document.getElementById(kind+'Text').value=templates[kind];
for(const button of document.querySelectorAll('button[data-kind]'))button.addEventListener('click',async()=>{
 const kind=button.dataset.kind,field=document.getElementById(kind+'Text'),status=document.getElementById(kind+'Status');
 try{if(!navigator.clipboard||!window.isSecureContext)throw Error('manual');await navigator.clipboard.writeText(templates[kind]);status.textContent='已复制，请粘贴到对应邮件的正文并保存。';}
 catch(_){document.getElementById(kind+'Details').open=true;field.focus();field.select();field.setSelectionRange(0,field.value.length);let ok=false;try{ok=document.execCommand('copy');}catch(_){}status.textContent=ok?'已复制，请粘贴并保存。':'正文已选中，请使用手机的复制菜单。';}
});
</script></main></body></html>
